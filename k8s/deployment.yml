apiVersion: apps/v1
kind: Deployment
metadata:
  name: mern-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mern-app
  template:
    metadata:
      labels:
        app: mern-app
    spec:
      containers:
      - name: mern-app
        image: vickydockek11/stackflow:latest
        ports:
        - containerPort: 5000
